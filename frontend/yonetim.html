<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Paneli · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <section class="fis genis">
      <h1>Yönetici Paneli</h1>
      <p class="alt">Menüleri oluşturun ve düzenleyin; doluluk ve puanları izleyin.</p>

      <p id="bildirim" class="bildirim bildirim-hata" role="alert" hidden></p>

      <div id="icerik">
        <div class="secimler">
          <div>
            <label for="yemekhane">Yemekhane</label>
            <select id="yemekhane"></select>
          </div>
          <div class="yonetim-yeni">
            <button id="yeniMenu" class="dugme" type="button">Yeni menü</button>
          </div>
        </div>

        <form id="menuFormu" class="yonetim-formu" hidden>
          <h2 id="formBaslik"></h2>
          <div class="secimler">
            <div>
              <label for="fYemekhane">Yemekhane</label>
              <select id="fYemekhane"></select>
            </div>
            <div>
              <label for="fOgun">Öğün</label>
              <select id="fOgun"></select>
            </div>
          </div>
          <div class="secimler">
            <div>
              <label for="fTarih">Tarih</label>
              <input id="fTarih" type="date" required>
            </div>
            <div></div>
          </div>
          <div class="secimler">
            <div>
              <label for="fOgrenci">Öğrenci fiyatı (TL)</label>
              <input id="fOgrenci" type="text" inputmode="decimal" autocomplete="off" required>
            </div>
            <div>
              <label for="fPersonel">Personel fiyatı (TL)</label>
              <input id="fPersonel" type="text" inputmode="decimal" autocomplete="off" required>
            </div>
          </div>
          <div id="yemekSecimi" class="yemek-secimi"></div>
          <div class="eylemler">
            <button class="dugme" type="submit">Kaydet</button>
            <button id="vazgec" class="dugme dugme-ikincil" type="button">Vazgeç</button>
          </div>
        </form>

        <h2>Menüler</h2>
        <ul class="rez-listesi" id="menuListesi"></ul>
      </div>

      <div class="eylemler" style="margin-top: 1.25rem;">
        <a class="dugme dugme-ikincil" href="/index.html">Ana sayfa</a>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/yonetim.js"></script>
</body>
</html>
