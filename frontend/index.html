<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yemekhane Otomasyonu · Giriş</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <section class="fis">
      <h1>Yemekhane Otomasyonu</h1>

      <div id="girisBolumu">
        <p class="alt">Devam etmek için giriş yapın.</p>
        <form id="girisFormu">
          <div class="alan">
            <label for="eposta">E-posta</label>
            <input id="eposta" type="email" autocomplete="username" required>
          </div>
          <div class="alan">
            <label for="sifre">Şifre</label>
            <input id="sifre" type="password" autocomplete="current-password" required>
          </div>
          <button class="dugme" type="submit">Giriş yap</button>
        </form>
      </div>

      <div id="oturumBolumu" hidden>
        <p id="selam" class="alt"></p>
        <p id="rolBilgi"></p>
        <div class="eylemler">
          <a class="dugme" href="/menu.html">Günün menüsü</a>
          <a class="dugme" href="/haftalik.html">Haftalık menü</a>
          <a class="dugme" href="/rezervasyonlarim.html">Rezervasyonlarım</a>
          <a class="dugme" href="/bakiye.html">Bakiye</a>
          <a class="dugme" href="/degerlendirme.html">Değerlendirme</a>
          <button id="cikisDugmesi" class="dugme dugme-ikincil" type="button">Çıkış yap</button>
        </div>
      </div>

      <p id="bildirim" class="bildirim bildirim-hata" role="alert" hidden></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/giris.js"></script>
</body>
</html>
